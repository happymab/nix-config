version: "3.8"

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: devcon-test
    container_name: devcon-test
    userns_mode: "keep-id"
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.ssh:/home/devuser/.ssh:ro
    environment:
      - DISPLAY=${DISPLAY}
    user: devuser
    working_dir: /workspace
    tty: true
    stdin_open: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
