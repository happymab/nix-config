[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.74999998323619366
capsule = true
center = ["group:g1"]
end = [
    "tray",
    "notifications",
    "screenshot",
    "clipboard",
    "bar_3",
    "network",
    "widget",
    "bluetooth",
    "keyboard_layout",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session",
]
margin_ends = 0
scale = 1.1000000089406967
start = ["launcher", "wallpaper", "bar", "bar_2", "workspaces"]
thickness = 36
widget_spacing = 8

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g1"
members = ["date", "spacer_2", "clock"]
opacity = 1.0
padding = 6.0

[battery]
warning_threshold = 20

[dock]
enabled = true
launcher_position = "start"
pinned = [
    "io.github.kolunmi.Bazaar",
    "dev.noctalia.luciole",
    "dev.zed.Zed",
    "brave-origin-Standard",
    "brave-origin-Development",
    "brave-origin-Investing",
    "io.freetubeapp.FreeTube",
    "proton-mail",
    "com.cherry_ai.CherryStudio",
]
reserve_space = false
show_dots = true
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 960.00006103515625
cy = 987.75506591796875
output = "eDP-1"
placement_height = 1200.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_media_controls = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[plugin_settings."icefish/phone-connect"]
details_open_near_click = false
details_widget_open_near_click = false

[plugin_settings."noctalia/umbriel-companion"]
panel_open_near_click = false

[plugin_settings."prponkshe/umbriel-displays"]
panel_open_near_click = false

[plugin_settings."riversyx/noctaproton-vpn"]
panel_open_near_click = false

[plugins]
enabled = [
    "noctalia/umbriel-companion",
    "prponkshe/umbriel-displays",
    "icefish/phone-connect",
]

[shell]
polkit_agent = true
umbriel_audio_provider_enabled = true

[shell.panel]
launcher_placement = "attached"

[shell.screenshot]
directory = "/home/mab/Pictures/Screenshots"

[theme]
builtin = "Catppuccin"
community_palette = "Cattppuccin Abyssal"
pure_black_dark = true

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "umbriel"]

[wallpaper]
directory = "/home/mab/.local/share/wallpapers"

[wallpaper.default]
path = "/home/mab/.local/share/wallpapers/3180608.jpg"

[wallpaper.last]
path = "/home/mab/.local/share/wallpapers/3180608.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/mab/.local/share/wallpapers/3180608.jpg"

[widget.bar]
type = "prponkshe/umbriel-displays:bar"

[widget.bar_2]
type = "noctalia/umbriel-companion:bar"

[widget.bar_3]
type = "icefish/phone-connect:bar"

[widget.network]
peek = true
vpn_status = "both"

[widget.spacer_2]
type = "spacer"

[widget.widget]
type = "autumn/network-toolkit:widget"
